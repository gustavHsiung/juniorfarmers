<!-- ══════════════════════════════════════════
     主容器
     ══════════════════════════════════════════ -->
<div class="container">

  <!-- ═══ REGISTER TAB（農場）═══ -->
  <div id="panelRegister">

    <div class="browse-subtab-bar">
      <button class="browse-subtab active" id="farmSubTabRegister" onclick="switchFarmSubTab('register')">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M3 2h10v3H3z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" fill="none"/><path d="M3 7.5h7M3 11h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        登記
      </button>
      <button class="browse-subtab" id="farmSubTabBrowse" onclick="switchFarmSubTab('browse')">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M3 4h10M3 8h7M3 12h5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        瀏覽與修改
      </button>
    </div>

    <!-- 登記子面板 -->
    <div id="farmSubPanelRegister">
      <div id="formSection">
        <div class="card">
          <div class="card-title">基本資料</div>
          <div class="row2">
            <div class="field">
              <label for="weekDate">登記週次（請選擇可出貨的週一）</label>
              <input type="date" id="weekDate" />
            </div>
            <div class="field">
              <label>農場 / 產地 <span style="color:var(--red-400)">*</span></label>
              <input type="text" id="farmerFarm" placeholder="例：好好吃有機農場" />
            </div>
          </div>
          <div class="row2" style="margin-top:11px">
            <div class="field">
              <label>登記人</label>
              <input type="text" id="register" placeholder="例：游大海" autocomplete="name" />
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-title">農產品品項 <span id="itemCountLabel" style="font-size:11px;color:var(--gray-400);font-weight:400;text-transform:none;letter-spacing:0;"></span></div>
          <div id="itemsContainer"></div>
          <button class="add-btn" onclick="addItem()">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            新增品項
          </button>
        </div>

        <div class="card">
          <div class="card-title">備註（選填）</div>
          <textarea id="notes" placeholder="例：小番茄下週供應量會增加…"></textarea>
        </div>

        <button class="submit-btn" id="submitBtn" onclick="handleSubmit()">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 1L17 9L9 17" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M1 9h16" stroke="white" stroke-width="1.8" stroke-linecap="round"/></svg>
          送出登記
        </button>
        <div class="error-msg" id="errorMsg"></div>
      </div>

      <div class="success-box" id="successBox" style="display:none">
        <span class="big-check">✅</span>
        <h2>登記成功！</h2>
        <p id="successDetail"></p>
        <p>我們會努力幫您用心的成果找到適合的餐桌。</p>
        <button class="re-btn" onclick="resetForm()">再填一次</button>
      </div>
    </div>

    <!-- 瀏覽與修改子面板 -->
    <div id="farmSubPanelBrowse" style="display:none">
      <div class="card">
        <div class="card-title">選擇週次查詢</div>
        <div class="browse-controls">
          <div class="field">
            <label for="browseWeekDate">可出貨週一日期</label>
            <input type="date" id="browseWeekDate" />
          </div>
          <button class="fetch-btn" id="fetchBtn" onclick="fetchBrowseData()">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            查詢
          </button>
        </div>
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
          <div class="chips-hint" id="chipsHint"></div>
          <div class="week-quick-select" id="weekChips"></div>
          <button class="refresh-text-btn" id="refreshBtn" onclick="refreshWeekChips()" style="display:none">↻ 重新整理</button>
        </div>
      </div>
      <div class="browse-spinner-wrap" id="browseSpinner"><div class="browse-spinner"></div></div>
      <div class="card" id="copyToNewWeekCard" style="display:none">
        <div>
          <div class="card-row">
            <label for="copyTargetDate">複製到目標週次（可出貨的週一）</label>
            <input type="date" id="copyTargetDate" />
            <button class="submit-btn slim-btn" id="copyConfirmBtn" onclick="confirmCopyStaging()" disabled>
              確定新增（<span id="copyStagingCount">0</span> 項）
            </button>
          </div>
        
        </div>
        <div id="copyStagingList">（按 👯‍♂️ 新增品項）</div>      
      </div>
      <div id="searchResults">
        <div class="browse-empty"><span class="empty-icon">🌱</span>請選擇週次後按「查詢」</div>
      </div>
    </div>
  </div><!-- /panelRegister -->

  <!-- ═══ ORDER TAB（餐廳）═══ -->
  <div id="panelOrder" style="display:none">

    <div class="browse-subtab-bar">
      <button class="browse-subtab order-tab active" id="orderSubTabEntry" onclick="switchOrderSubTab('entry')">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M3 2h10v3H3z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" fill="none"/><path d="M3 7.5h7M3 11h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        下單
      </button>
      <button class="browse-subtab order-tab" id="orderSubTabBrowse" onclick="switchOrderSubTab('browse')">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M3 4h10M3 8h7M3 12h5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        瀏覽與修改
      </button>
    </div>

    <!-- 下單子面板 -->
    <div id="orderSubPanelEntry">
      <div id="orderFormSection">

        <div class="card">
          <div class="order-step-label">
            <span class="step-badge" style="background:var(--red-600)">1</span>
            <span class="step-title">貼入下單訊息</span>
          </div>
          <textarea class="order-raw-textarea" id="orderRawText"
            placeholder="例如：&#10;恰比兔子&#10;綠火焰/2斤&#10;龍葵2斤&#10;&#10;雲舍&#10;紅蘿蔔+2包&#10;青蔥+2把"></textarea>
          <div class="parse-hint">支援格式：品名＋數量＋單位（公斤/斤/顆/把/包/支…），中文數字亦可。</div>
          <button class="parse-btn" onclick="parseAndPreview()">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M2 4h12M2 8h8M2 12h5" stroke="white" stroke-width="1.5" stroke-linecap="round"/></svg>
            解析訂單
          </button>
        </div>

        <div class="card" id="orderPreviewCard" style="display:none">
          <div class="order-step-label">
            <span class="step-badge" style="background:var(--red-600)">2</span>
            <span class="step-title">確認 / 修改品項</span>
          </div>
          <div id="orderSummaryBar" class="order-summary-bar"></div>
          <div style="overflow-x:auto;">
            <table class="order-preview-table" id="orderPreviewTable">
              <thead>
                <tr>
                  <th>店家／料理人</th><th>品名</th><th>數量</th>
                  <th>單位</th><th>單價（元）</th><th>小計</th><th></th>
                </tr>
              </thead>
              <tbody id="orderPreviewBody"></tbody>
            </table>
          </div>
          <button class="add-btn" onclick="addOrderRow()" style="margin-top:10px">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            手動新增一列
          </button>
        </div>

        <div class="card" id="orderDetailsCard" style="display:none">
          <div class="order-step-label">
            <span class="step-badge" style="background:var(--red-600)">3</span>
            <span class="step-title">填寫交貨資訊</span>
          </div>
          <div class="row2">
            <div class="field">
              <label>登記人</label>
              <input type="text" id="orderRegistrant" placeholder="填寫人姓名" />
            </div>
            <div class="field">
              <label>週次（週一日期）</label>
              <input type="date" id="orderWeekDate" />
            </div>
          </div>
          <div class="row2" style="margin-top:10px">
            <div class="field">
              <label>送貨地點</label>
              <input type="text" id="orderDeliveryLocation" placeholder="例：花蓮市區集貨點" />
            </div>
            <div class="field">
              <label>送貨時間</label>
              <input type="text" id="orderDeliveryTime" placeholder="例：週三上午10點" />
            </div>
          </div>
          <div class="field" style="margin-top:10px">
            <label>付款狀態</label>
            <select id="orderPaymentStatus">
              <option value="">未設定</option>
              <option value="待付款">待付款</option>
              <option value="已付款">已付款</option>
              <option value="貨到付款">貨到付款</option>
            </select>
          </div>
          <div class="field" style="margin-top:10px">
            <label>整批備註（選填）</label>
            <textarea id="orderBatchNote" placeholder="例：本批請冷藏運送…" style="min-height:52px"></textarea>
          </div>
        </div>

        <button class="submit-btn red-btn" id="orderSubmitBtn" onclick="submitOrder()" style="display:none">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 1L17 9L9 17" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M1 9h16" stroke="white" stroke-width="1.8" stroke-linecap="round"/></svg>
          送出訂單
        </button>
        <div class="error-msg" id="orderErrorMsg"></div>
      </div>

      <div class="success-box" id="orderSuccessBox" style="display:none">
        <span class="big-check">📋</span>
        <h2>訂單登記成功！</h2>
        <p id="orderSuccessDetail"></p>
        <button class="re-btn" onclick="resetOrderForm()">再填一次</button>
      </div>
    </div>

    <!-- 訂單瀏覽子面板 -->
    <div id="orderSubPanelBrowse" style="display:none">
      <div class="card">
        <div class="card-title">選擇週次查詢訂單</div>
        <div class="browse-controls">
          <div class="field">
            <label for="orderBrowseWeekDate">週一日期</label>
            <input type="date" id="orderBrowseWeekDate" />
          </div>
          <button class="fetch-btn" id="orderFetchBtn" onclick="fetchOrderBrowseData()" style="background:var(--red-600)">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            查詢
          </button>
        </div>
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
          <div class="chips-hint" id="orderChipsHint"></div>
          <div class="week-quick-select" id="orderWeekChips"></div>
          <button class="refresh-text-btn" id="orderRefreshBtn" onclick="refreshOrderWeekChips()" style="display:none">↻ 重新整理</button>
        </div>
        <div class="order-browse-filter">
          <div class="field">
            <label>篩選店家（選填）</label>
            <input type="text" id="orderShopFilter" placeholder="輸入店家名稱關鍵字…" />
          </div>
        </div>
      </div>
      <div class="browse-spinner-wrap" id="orderBrowseSpinner">
        <div class="browse-spinner" style="border-top-color:var(--red-600)"></div>
      </div>
      <div id="orderSearchResults">
        <div class="browse-empty"><span class="empty-icon">🧾</span>請選擇週次後按「查詢」</div>
      </div>
    </div>

  </div><!-- /panelOrder -->

<!-- ═══ BROWSE TAB（供需分析）═══ -->
  <div id="panelBrowse" style="display:none">
    <div class="card">
      <div class="card-title">選擇週次分析</div>
      <div class="browse-controls">
        <div class="field">
          <label for="analysisWeekDate">週一日期</label>
          <input type="date" id="analysisWeekDate" />
        </div>
        <button class="fetch-btn" onclick="fetchAnalysisData()">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          分析
        </button>
      </div>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px">
        <div class="chips-hint" id="analysisChipsHint"></div>
        <div class="week-quick-select" id="analysisWeekChips"></div>
        <button class="refresh-text-btn" id="analysisRefreshBtn" onclick="loadAnalysisWeekChips()" style="display:none">↻ 重新整理</button>
      </div>
    </div>
    <div class="browse-spinner-wrap" id="analysisSpinner" style="display:none"><div class="browse-spinner"></div></div>
    <div id="analysisResults">
      <div class="browse-empty"><span class="empty-icon">🗂️</span>請選擇週次後按「分析」</div>
    </div>
  </div>
  <div class="footer">農二菜車的農產品供應登記系統 · 感謝您的使用</div>
</div><!-- /container -->

<!-- ══════════════════════════════════════════
     JS — 載入順序：shared → farm → order
     ══════════════════════════════════════════ -->
<script src="js/shared.js"></script>
<script src="js/tab-farm.js"></script>
<script src="js/tab-order.js"></script>
<script src="js/tab-browse.js"></script>
</body>
</html>
